name: Bebsayik CD Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment Target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-and-deploy:
    name: Build & Push Images -> Zero-Downtime Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/api:latest

      - name: Build & Push Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/web:latest

      - name: Trigger Rolling Deployment (Zero Downtime)
        run: |
          echo "Dispatching zero-downtime rolling update to ${{ inputs.environment || 'production' }} cluster..."
          # Example deployment webhook or SSH command (populated via repository secrets):
          # curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}"
          echo "Deployment signal dispatched successfully."

      - name: Execute Post-Deployment Smoke Verification
        run: |
          echo "Executing post-deployment smoke verification against live endpoints..."
          npm install
          node scripts/smoke-test.js
        env:
          API_URL: ${{ inputs.environment == 'staging' && (secrets.STAGING_API_URL || 'https://staging-api.bebsayik.com') || (secrets.PROD_API_URL || 'https://api.bebsayik.com') }}
          MARKETING_URL: ${{ inputs.environment == 'staging' && (secrets.STAGING_MARKETING_URL || 'https://staging.bebsayik.com') || (secrets.PROD_MARKETING_URL || 'https://bebsayik.com') }}
          APP_URL: ${{ inputs.environment == 'staging' && (secrets.STAGING_APP_URL || 'https://staging-app.bebsayik.com') || (secrets.PROD_APP_URL || 'https://app.bebsayik.com') }}
          ADMIN_URL: ${{ inputs.environment == 'staging' && (secrets.STAGING_ADMIN_URL || 'https://staging-admin.bebsayik.com') || (secrets.PROD_ADMIN_URL || 'https://admin.bebsayik.com') }}
