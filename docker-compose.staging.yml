services:
  # ----------------------------------------------------------------------------
  # 1. Bebsayik Express API Gateway — Staging (Node.js 22 Alpine)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: bebsayik-api:staging
    container_name: bebsayik-api-staging
    restart: always
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - PORT=5000
      - REDIS_URI=redis://redis:6379
    ports:
      - "${STAGING_API_PORT:-127.0.0.1:5000}:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - staging_backend_net
      - staging_frontend_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. Hardened Nginx Multi-Subdomain Web Server — Staging (Frontends)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: bebsayik-web:staging
    container_name: bebsayik-web-staging
    restart: always
    ports:
      - "${STAGING_WEB_PORT:-127.0.0.1:8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - staging_frontend_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # ----------------------------------------------------------------------------
  # 3. Redis 7 Cache, Rate Limiting & Distributed Locks — Staging
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bebsayik-redis-staging
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_staging_data:/data
    networks:
      - staging_backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

networks:
  staging_frontend_net:
    driver: bridge
  staging_backend_net:
    internal: true

volumes:
  redis_staging_data:
    driver: local
