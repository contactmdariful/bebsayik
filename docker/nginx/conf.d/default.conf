# ==============================================================================
# Bebsayik.com — Multi-Domain Virtual Host Configuration
# Domains:
#   - bebsayik.com / www.bebsayik.com  -> Marketing Frontend
#   - app.bebsayik.com                 -> Tenant Web ERP & Mobile POS
#   - admin.bebsayik.com               -> Platform Super Admin Portal
# ==============================================================================

# Common Security Headers Map
map $sent_http_content_type $cache_control_header {
    default                             "no-cache, no-store, must-revalidate";
    ~*image/                            "public, max-age=2592000, immutable";
    ~*font/                             "public, max-age=31536000, immutable";
    ~*text/css                          "public, max-age=31536000, immutable";
    ~*application/javascript            "public, max-age=31536000, immutable";
}

# ------------------------------------------------------------------------------
# 1. Marketing Website (bebsayik.com / staging.bebsayik.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bebsayik.com www.bebsayik.com staging.bebsayik.com;
    root /usr/share/nginx/html/marketing;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Static Immutable Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API Proxy to Express Gateway
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA Fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

